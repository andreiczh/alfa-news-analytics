<!doctype html>
<html lang="ru">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Вход — Пульс бизнеса</title>
    <link rel="stylesheet" href="/static/login.css?v=0.6.3" />
    <link rel="icon" href="/static/favicon.svg" />
  </head>
  <body class="account-page">
    <main class="account-shell">
      <a class="brand account-brand" href="/auth/login">
        <img src="/static/favicon.svg" width="32" height="32" alt="" />
        Пульс бизнеса
      </a>
      <section class="account-card" aria-labelledby="login-title">
        <h1 id="login-title">Войти в аккаунт</h1>
        <p class="account-description">Ваша компания, новости и исследования.</p>
        <form action="/auth/login" method="post">
          <label for="login">Логин</label>
          <input id="login" name="login" autocomplete="username" autocapitalize="none"
            spellcheck="false" maxlength="64" required autofocus />
          <label for="password">Пароль</label>
          <input id="password" name="password" type="password"
            autocomplete="current-password" maxlength="256" required />
          <p class="error" role="alert">{{ERROR}}</p>
          <button type="submit">Войти</button>
        </form>
        <p class="account-switch">Первый раз здесь? <a href="/auth/register">Создать аккаунт</a></p>
      </section>
      <p class="account-foot">Пилот для хакатона Альфа-Банка</p>
    </main>
  </body>
</html>
