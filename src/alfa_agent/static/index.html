<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <meta name="app-token" content="{{APP_TOKEN}}" />
    <meta name="theme-color" content="#f6f7f9" />
    <title>Пульс бизнеса</title>
    <link rel="icon" href="/static/favicon.svg" type="image/svg+xml" />
    <link rel="stylesheet" href="/static/style.css" />
    <script src="/static/app.js" defer></script>
  </head>
  <body>
    <a class="skip-link" href="#main">К содержимому</a>
    <header class="topbar">
      <button
        id="mobile-menu"
        class="icon-button mobile-only"
        aria-label="Открыть меню"
        aria-expanded="false"
      >
        ☰</button
      ><a href="/" class="brand"
        ><span class="brand-mark">А</span
        ><span>Пульс бизнеса<small>Аналитика для решений</small></span></a
      ><span class="badge demo-badge">Демо хакатона</span
      ><button
        id="account"
        class="account-button"
        aria-label="Профиль сотрудника"
      >
        <span id="avatar" class="avatar">П</span
        ><span class="account-copy"
          ><strong id="user-name">Ваш профиль</strong
          ><small id="user-role">Загрузка</small></span
        >
      </button>
    </header>
    <div class="app-layout">
      <aside id="sidebar" class="sidebar">
        <nav aria-label="Основное меню">
          <button data-view="home" class="nav-item active">
            <span data-icon="home"></span>Обзор</button
          ><button data-view="research" class="nav-item">
            <span data-icon="spark"></span>Исследование</button
          ><button data-view="company" class="nav-item">
            <span data-icon="building"></span>Моя компания</button
          ><button data-view="library" class="nav-item">
            <span data-icon="book"></span>Материалы банка
          </button>
        </nav>
        <div class="sidebar-bottom">
          <button id="company-switch" class="company-switch">
            <span class="caption">Рабочая компания</span
            ><strong id="company-name">Загрузка…</strong
            ><span class="link-text">Сменить компанию</span></button
          ><button id="help" class="quiet-button">Как работает сервис</button>
        </div>
      </aside>
      <div class="main-wrap">
        <div id="storage-notice" class="storage-notice" hidden></div>
        <main id="main" tabindex="-1" aria-busy="true">
          <div class="loading-initial">
            <span class="spinner"></span>
            <p>Открываем ваше рабочее пространство</p>
          </div>
        </main>
        <footer>
          Прототип для кейса Альфа-Банка · Решения принимает руководитель
        </footer>
      </div>
    </div>
    <dialog id="dialog" aria-labelledby="dialog-title">
      <div class="dialog-header">
        <h2 id="dialog-title"></h2>
        <button id="close-dialog" class="icon-button" aria-label="Закрыть окно">
          ×
        </button>
      </div>
      <div id="dialog-content"></div>
    </dialog>
    <div id="toast" class="toast" role="status" aria-live="polite" hidden></div>
  </body>
</html>
