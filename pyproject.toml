[project]
name = "alfa-news-agent"
version = "0.2.0"
description = "Own Python research loop: rate news, company exposures, bank evidence and role views"
requires-python = ">=3.12,<3.14"
dependencies = [
  "fastapi>=0.115,<1",
  "httpx>=0.28,<1",
  "pydantic>=2.10,<3",
  "uvicorn>=0.34,<1",
  "python-multipart>=0.0.20,<1",
  "pypdf>=6,<7",
  "pypdfium2>=4,<6",
  "openpyxl>=3.1,<4",
  "Pillow>=11,<14"
]

[dependency-groups]
dev = ["pytest>=8,<10", "ruff>=0.11,<1"]

[project.scripts]
alfa-agent = "alfa_agent.cli:main"

[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/alfa_agent"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
target-version = "py312"
line-length = 110

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
